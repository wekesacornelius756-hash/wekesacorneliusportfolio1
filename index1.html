<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel | Portfolio Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--gold:#ffc107;--bg:#050b24;--panel:#0a1236;--line:#1d2a63;--text:#f4f6ff;--mute:#aab3d8}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:40px 32px;width:100%;max-width:420px;display:grid;gap:16px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.box .shield-icon{font-size:4.5rem;color:var(--gold);margin-bottom:8px}
.box h2{font-size:1.6rem;font-weight:700;margin-bottom:4px}
.box p{color:var(--mute);font-size:0.9rem;margin-bottom:16px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .logo{display:flex;align-items:center;gap:14px;padding:0 10px 24px;border-bottom:1px solid var(--line);margin-bottom:16px}
aside .logo i{font-size:2.4rem;color:var(--gold)}
aside .logo span{font-size:1.1rem;font-weight:700;line-height:1.2}
aside .logo span small{display:block;font-size:0.75rem;color:var(--mute);font-weight:400}
aside button{background:none;border:0;color:var(--text);text-align:left;padding:12px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:0.95rem;display:flex;align-items:center;gap:10px;transition:.2s;width:100%}
aside button i{width:20px;font-size:1.1rem;color:var(--mute);text-align:center}
aside button.on,aside button:hover{background:var(--line);color:var(--gold)}
aside button.on i,aside button:hover i{color:var(--gold)}
aside .sp{flex:1}
main{padding:32px;max-width:900px;width:100%}
h2{margin-bottom:20px;font-size:1.8rem}
label{display:block;font-weight:600;margin:16px 0 6px;font-size:0.95rem}
small{color:var(--mute);display:block;margin-top:4px;font-size:0.85rem}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;font:inherit;font-size:0.95rem}
input[type=color]{height:44px;padding:4px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--gold);color:#1a1300;border:0;border-radius:999px;padding:12px 28px;font-weight:700;cursor:pointer;font:inherit;font-size:0.95rem;transition:.2s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.red{background:#c0392b;color:#fff}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}
.prev{max-height:120px;max-width:100%;border-radius:8px;margin-top:10px;border:1px solid var(--line)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;display:flex;gap:16px;align-items:flex-start;transition:.2s}
.item:hover{border-color:var(--gold)}
.item img{width:100px;height:70px;object-fit:cover;border-radius:6px}
.item .g{flex:1;min-width:0}
.item p{color:var(--mute);overflow-wrap:anywhere;font-size:0.9rem;margin-top:4px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--gold);color:#1a1300;padding:14px 22px;border-radius:10px;font-weight:700;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.bad{background:#ff6b6b;color:#fff}
.err{color:#ff7a7a;font-size:0.9rem}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:16px}
  aside .logo{width:100%;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:8px}
  aside .sp{display:none}
  aside button{width:auto;padding:10px 14px;font-size:0.85rem}
}
</style>
</head>
<body>
<div class="login" id="login"><form class="box" id="lf">
 <div class="shield-icon"><i class="fas fa-shield-alt"></i></div>
 <h2>Admin Access</h2>
 <p>Sign in to manage your portfolio</p>
 <input id="em" type="email" placeholder="Email" autocomplete="username" required>
 <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
 <button class="btn" type="submit">Sign in</button><p class="err" id="le"></p>
</form></div>

<div class="app" id="app" hidden>
 <aside id="nav">
   <div class="logo">
     <i class="fas fa-shield-alt"></i>
     <span>Admin Panel<small>Portfolio Management</small></span>
   </div>
 </aside>
 <main><div id="view"></div></main>
</div>
<div id="toast" hidden></div>

<script type="module">
import { db, auth, DEFAULTS } from "./firebase.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc, setDoc, collection, getDocs, addDoc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $ = id => document.getElementById(id);

// UPDATED mk function: Handles HTML strings correctly
const mk = (t, c, x) => { 
  const e = document.createElement(t); 
  if (c) e.className = c; 
  if (x != null) {
    if (typeof x === 'string' && x.includes('<')) {
      e.innerHTML = x;
    } else {
      e.textContent = x;
    }
  }
  return e; 
};

const toast = (m, bad) => { const t = $("toast"); t.textContent = m; t.className = bad ? "bad" : ""; t.hidden = false; setTimeout(() => t.hidden = true, 2800); };

const get = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
const set = (o, p, v) => { const ks = p.split("."); const l = ks.pop(); ks.reduce((a, k) => a[k] ??= {}, o)[l] = v; };

function resize(file, max) { 
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => { 
      const i = new Image(); 
      i.onerror = rej; 
      i.onload = () => {
        const s = Math.min(1, max / Math.max(i.width, i.height)); 
        const c = document.createElement("canvas");
        c.width = Math.round(i.width * s); 
        c.height = Math.round(i.height * s);
        c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); 
        res(c.toDataURL("image/webp", .82)); 
      };
      i.src = r.result; 
    };
    r.readAsDataURL(file);
  });
}

function field(f, data) {
  const w = mk("div"); 
  w.append(Object.assign(mk("label", "", f.l), { htmlFor: "f_" + f.k }));
  let el, v = get(data, f.k);
  
  if (f.t === "img") {
    el = mk("input"); el.type = "file"; el.accept = "image/*"; el.id = "f_" + f.k;
    const pv = mk("img", "prev"); pv.hidden = !v; if (v) pv.src = v; 
    const rm = mk("button", "btn ghost", "Remove image"); rm.type = "button"; rm.hidden = !v; rm.style.marginTop = "10px";
    el.onchange = async () => { 
      try { const d = await resize(el.files[0], f.max || 800); set(data, f.k, d); pv.src = d; pv.hidden = rm.hidden = false; } 
      catch { toast("Image failed", 1); } 
    };
    rm.onclick = () => { set(data, f.k, ""); pv.hidden = rm.hidden = true; el.value = ""; };
    w.append(el, pv, rm);
    return w;
  }
  
  el = f.t === "area" || f.t === "lines" || f.t === "pairs" ? mk("textarea") : mk("input");
  el.id = "f_" + f.k; 
  if (f.t === "area") el.rows = 4; 
  if (f.t === "lines" || f.t === "pairs") el.rows = 5;
  if (f.t === "color") el.type = "color";
  
  const show = () => f.t === "lines" ? (v || []).join("\n") 
    : f.t === "csv" ? (v || []).join(", ") 
    : f.t === "pairs" ? (v || []).map(x => (x[f.a] || "") + " | " + (x[f.b] || "")).join("\n") 
    : v ?? "";
  el.value = show();
  
  el.oninput = () => {
    const x = el.value;
    set(data, f.k, f.t === "lines" ? x.split("\n").map(s => s.trim()).filter(Boolean)
      : f.t === "csv" ? x.split(",").map(s => s.trim()).filter(Boolean)
      : f.t === "pairs" ? x.split("\n").filter(s => s.trim()).map(s => { 
          const [a, ...b] = s.split("|"); 
          return { [f.a]: a.trim(), [f.b]: b.join("|").trim() }; 
        })
      : x);
  };
  w.append(el); if (f.h) w.append(mk("small", "", f.h));
  return w;
}

const TABS = {
  General: [
    { k: "brand", l: "Brand name (nav & footer)" }, 
    { k: "logoImg", l: "Logo image", t: "img", max: 300 },
    { k: "greeting", l: "Hero greeting" }, 
    { k: "name", l: "Your full name", h: "Last word is highlighted in gold." },
    { k: "role", l: "Role / title" }, 
    { k: "tagline", l: "Hero tagline", t: "area" },
    { k: "heroImg", l: "Hero portrait (transparent PNG looks best)", t: "img", max: 900 },
    { k: "techs", l: "Technology badges", t: "csv", h: "Comma separated. E.g. React, Next.js, Node.js" },
    { k: "gold", l: "Accent colour", t: "color" }, 
    { k: "bg", l: "Background colour (dark mode)", t: "color" }
  ],
  About: [
    { k: "aboutTitle", l: "Section title" }, 
    { k: "aboutSub", l: "Subtitle" }, 
    { k: "aboutText", l: "About text", t: "area" },
    { k: "aboutPoints", l: "Highlights", t: "lines", h: "One per line." }, 
    { k: "aboutImg", l: "About image", t: "img", max: 800 },
    { k: "cvUrl", l: "CV link (Google Drive / PDF URL)", h: "Storage isn't used, so paste a public link." }
  ],
  "Stats & Services": [
    { k: "stats", l: "Stats", t: "pairs", a: "n", b: "label", h: "One per line: 50+ | Projects Completed" },
    { k: "services", l: "Services", t: "pairs", a: "title", b: "desc", h: "One per line: Title | Description" }
  ],
  Contact: [
    { k: "phone", l: "Phone" }, 
    { k: "email", l: "Email" }, 
    { k: "location", l: "Location" },
    ...["whatsapp", "facebook", "youtube", "linkedin", "github"].map(s => ({ k: "socials." + s, l: s[0].toUpperCase() + s.slice(1) + " URL" }))
  ]
};

let cfg = null;

async function renderSettings(name) {
  const v = $("view"); v.replaceChildren(mk("h2", "", name));
  v.append(...TABS[name].map(f => field(f, cfg)));
  const r = mk("div", "row"); 
  const b = mk("button", "btn", '<i class="fas fa-save"></i> Save changes');
  b.onclick = async () => {
    if (JSON.stringify(cfg).length > 900000) return toast("Too much image data — remove or shrink an image.", 1);
    try { await setDoc(doc(db, "site", "config"), cfg); toast("Saved"); } 
    catch (e) { toast("Save failed: " + e.code, 1); }
  };
  const open = Object.assign(mk("a", "btn ghost", '<i class="fas fa-external-link-alt"></i> View site'), { href: "index.html", target: "_blank" });
  r.append(b, open); v.append(r);
}

const PF = [
  { k: "title", l: "Title" }, 
  { k: "category", l: "Category", h: "e.g. Web Apps, Mobile Apps, Tools, Design" },
  { k: "desc", l: "Short description", t: "area" }, 
  { k: "link", l: "Project link" }, 
  { k: "order", l: "Sort order (1 shows first)" },
  { k: "img", l: "Project image", t: "img", max: 640 }
];

async function renderProjects(edit) {
  const v = $("view"); v.replaceChildren(mk("h2", "", "Projects"));
  const data = edit ? { ...edit.data } : { title: "", category: "", desc: "", link: "", order: "1", img: "" };
  v.append(mk("h3", "", edit ? "Edit project" : "Add project"), ...PF.map(f => field(f, data)));
  const r = mk("div", "row"); 
  const s = mk("button", "btn", edit ? '<i class="fas fa-save"></i> Update project' : '<i class="fas fa-plus"></i> Add project');
  s.onclick = async () => {
    if (!data.title.trim()) return toast("Title is required", 1);
    const out = { ...data, order: Number(data.order) || 0 };
    try { 
      edit ? await updateDoc(doc(db, "projects", edit.id), out) : await addDoc(collection(db, "projects"), out); 
      toast("Saved"); 
      renderProjects(); 
    }
    catch (e) { toast("Failed: " + e.code, 1); }
  };
  r.append(s); 
  if (edit) { 
    const c = mk("button", "btn ghost", '<i class="fas fa-times"></i> Cancel'); 
    c.onclick = () => renderProjects(); 
    r.append(c); 
  }
  v.append(r, mk("h3", "", "All projects"));
  (await getDocs(query(collection(db, "projects"), orderBy("order")))).docs.forEach(d => {
    const p = d.data(), it = mk("div", "item"), g = mk("div", "g");
    if (p.img) { const im = mk("img"); im.src = p.img; im.alt = ""; it.append(im); }
    g.append(mk("b", "", p.title + (p.category ? " · " + p.category : "")), mk("p", "", p.desc || ""));
    const e = mk("button", "btn ghost", '<i class="fas fa-edit"></i> Edit'), x = mk("button", "btn red", '<i class="fas fa-trash"></i> Delete');
    e.onclick = () => { renderProjects({ id: d.id, data: p }); scrollTo(0, 0); };
    x.onclick = async () => { if (confirm("Delete this project?")) { await deleteDoc(doc(db, "projects", d.id)); renderProjects(); } };
    it.append(g, e, x); v.append(it);
  });
}

const BF = [
  { k: "title", l: "Title" }, 
  { k: "category", l: "Category", h: "e.g. Tutorial, Opinion, Backend" },
  { k: "desc", l: "Short description", t: "area" }, 
  { k: "link", l: "Read more link" }, 
  { k: "order", l: "Sort order (1 shows first)" },
  { k: "img", l: "Featured image", t: "img", max: 640 }
];

async function renderBlog(edit) {
  const v = $("view"); v.replaceChildren(mk("h2", "", "Blog Posts"));
  const data = edit ? { ...edit.data } : { title: "", category: "", desc: "", link: "", order: "1", img: "" };
  v.append(mk("h3", "", edit ? "Edit post" : "Add post"), ...BF.map(f => field(f, data)));
  const r = mk("div", "row"); 
  const s = mk("button", "btn", edit ? '<i class="fas fa-save"></i> Update post' : '<i class="fas fa-plus"></i> Add post');
  s.onclick = async () => {
    if (!data.title.trim()) return toast("Title is required", 1);
    const out = { ...data, order: Number(data.order) || 0 };
    try { 
      edit ? await updateDoc(doc(db, "posts", edit.id), out) : await addDoc(collection(db, "posts"), out); 
      toast("Saved"); 
      renderBlog(); 
    }
    catch (e) { toast("Failed: " + e.code, 1); }
  };
  r.append(s); 
  if (edit) { 
    const c = mk("button", "btn ghost", '<i class="fas fa-times"></i> Cancel'); 
    c.onclick = () => renderBlog(); 
    r.append(c); 
  }
  v.append(r, mk("h3", "", "All posts"));
  (await getDocs(query(collection(db, "posts"), orderBy("order")))).docs.forEach(d => {
    const p = d.data(), it = mk("div", "item"), g = mk("div", "g");
    if (p.img) { const im = mk("img"); im.src = p.img; im.alt = ""; it.append(im); }
    g.append(mk("b", "", p.title + (p.category ? " · " + p.category : "")), mk("p", "", p.desc || ""));
    const e = mk("button", "btn ghost", '<i class="fas fa-edit"></i> Edit'), x = mk("button", "btn red", '<i class="fas fa-trash"></i> Delete');
    e.onclick = () => { renderBlog({ id: d.id, data: p }); scrollTo(0, 0); };
    x.onclick = async () => { if (confirm("Delete this post?")) { await deleteDoc(doc(db, "posts", d.id)); renderBlog(); } };
    it.append(g, e, x); v.append(it);
  });
}

async function renderMessages() {
  const v = $("view"); v.replaceChildren(mk("h2", "", "Messages"));
  const s = await getDocs(query(collection(db, "messages"), orderBy("createdAt", "desc")));
  if (s.empty) v.append(mk("p", "", "No messages yet."));
  s.docs.forEach(d => {
    const m = d.data(), it = mk("div", "item"), g = mk("div", "g");
    g.append(mk("b", "", m.name + " — " + m.email), mk("p", "", m.message), mk("small", "", m.createdAt?.toDate().toLocaleString() || ""));
    const x = mk("button", "btn red", '<i class="fas fa-trash"></i> Delete'); x.onclick = async () => { await deleteDoc(doc(db, "messages", d.id)); renderMessages(); };
    it.append(g, x); v.append(it);
  });
}

function buildNav() {
  const n = $("nav"); 
  // Clear only the navigation buttons, keep the logo
  const logo = n.querySelector(".logo");
  n.replaceChildren(logo);
  
  const go = (label, icon, fn) => { 
    const b = mk("button"); 
    b.innerHTML = `<i class="fas ${icon}"></i> ${label}`;
    b.onclick = () => { 
      n.querySelectorAll("button").forEach(x => x.classList.remove("on")); 
      b.classList.add("on"); 
      fn(); 
    }; 
    n.append(b); 
    return b; 
  };
  
  const first = Object.keys(TABS).map(t => go(t, "fa-cog", () => renderSettings(t)));
  go("Projects", "fa-briefcase", () => renderProjects()); 
  go("Blog Posts", "fa-newspaper", () => renderBlog()); 
  go("Messages", "fa-envelope", () => renderMessages());
  
  n.append(mk("div", "sp")); 
  
  const o = mk("button"); 
  o.innerHTML = '<i class="fas fa-sign-out-alt"></i> Sign out'; 
  o.onclick = () => signOut(auth); 
  n.append(o);
  
  if (first.length > 0) first[0].click();
}

onAuthStateChanged(auth, async u => {
  $("login").hidden = !!u; $("app").hidden = !u;
  if (!u) return;
  try { 
    const s = await getDoc(doc(db, "site", "config")); 
    cfg = structuredClone({ ...DEFAULTS, ...(s.exists() ? s.data() : {}) }); 
    cfg.socials = { ...DEFAULTS.socials, ...cfg.socials }; 
    buildNav(); 
  }
  catch (e) { toast("Could not load settings: " + e.code, 1); }
});

$("lf").onsubmit = async e => {
  e.preventDefault(); $("le").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value, $("pw").value); } 
  catch { $("le").textContent = "Email or password is incorrect."; }
};
</script>
</body>
</html>
